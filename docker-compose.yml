services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    # ฐานข้อมูลเดิมจาก Windows ใช้ชื่อตารางตัวพิมพ์เล็ก
    # ค่านี้ต้องตั้งตั้งแต่สร้าง volume ครั้งแรก เพื่อให้ Prisma migration เก่าใช้ได้บน Linux
    command: --lower_case_table_names=1

    env_file:
      - .env.production

    volumes:
      - stresscare_mysql_data:/var/lib/mysql

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h localhost -u root -p$$MYSQL_ROOT_PASSWORD"
        ]
      interval: 10s
      timeout: 5s
      retries: 12

  app:
    build:
      context: .
      dockerfile: Dockerfile

    restart: unless-stopped

    env_file:
      - .env.production

    ports:
      # Server ภายนอก : Next.js ภายใน Docker
      - "3067:3000"

    depends_on:
      mysql:
        condition: service_healthy

volumes:
  stresscare_mysql_data:
